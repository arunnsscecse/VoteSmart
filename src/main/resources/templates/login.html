<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Login - VoteSmart</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .login-card {
            max-width: 560px;
            margin: auto;
            padding: 45px 35px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .login-card h1 {
            font-size: 32px;
            margin: 18px 0;
        }

        .login-card p {
            color: crimson;
            margin-bottom: 30px;
        }

        .login-option {
            display: block;
            padding: 16px;
            margin-top: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            color: #06234c;
            background: linear-gradient(100deg, #50f4e6, #4da8ff);
            transition: 0.25s;
        }
        .p-btn {
            display: block;
            padding: 16px;
            margin-top: 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            color: #06234c;
            background: linear-gradient(100deg, #50f4e6, #4da8ff);
            transition: 0.25s;
        }
        .login-option.admin {
            background: linear-gradient(100deg, #a7f3d0, #5eead4);
        }

        .login-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(40,200,255,0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            color:#507cff;
            text-decoration: none;
        }
    </style>
</head>

<body>
<header class="navbar">
    <div class="logo">🗳️ VoteSmart</div>
    <div class="nav-tag">Secure Digital Voting</div>
</header>

<main class="hero">
    <section class="login-card">
        <div style="font-size:45px;">🗳️</div>

        <h1>ONLINE VOTING SYSTEM</h1>
        <p>Choose your login type to continue.</p>

        <a class="login-option" th:href="@{/voter-login}">
            👤 Voter Login →
        </a>

        <a class="login-option admin" th:href="@{/admin-login}">
            🔐 Admin Login →
        </a>

        <a class="p-btn" th:href="@{/results}">
            🏆 View Results →
        </a>

        <a class="back-link" th:href="@{/}">
            ← Back to Home
        </a>
    </section>
</main>

<footer>© 2026 NSSCE Online Voting System</footer>
<style>
    html body {
        min-height: 100vh;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        align-items: stretch !important;
    }
    html body > header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; }
    html body > main   { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; }
    html body > footer { width: 100%; text-align: center; padding: 16px; }
</style>
</body>
</html>
