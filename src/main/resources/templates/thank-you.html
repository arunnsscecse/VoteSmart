<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You - VoteSmart</title>
    <link rel="stylesheet" th:href="@{/portal.css}">
</head>
<body>
<header class="p-header">
    <div class="p-logo">🗳️ VoteSmart</div>
    <div class="p-tag">Voter Portal</div>
</header>

<main class="p-main">
    <section class="p-card">
        <div class="p-icon">✅</div>
        <h1>Thank you<span th:if="${voterName}">, <span th:text="${voterName}"></span></span>!</h1>
        <p>Your vote has been recorded successfully.<br>Every vote represents a voice.</p>
        <a class="p-btn" href="/">← Back to Home</a>
        <a class="p-btn" href="/results" style="margin-top:10px">View Results</a>
    </section>
</main>


<footer class="p-footer">© 2026 OOPS Project Online Voting System • Secure • Simple • Transparent</footer>
</body>
</html>
